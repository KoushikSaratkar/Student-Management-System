<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #0056b3;
            padding: 9px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h1 {
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .save-btn {
            border: none;
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #0056b3;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            padding: 12px 25px;
            border-radius: 7px;
            text-decoration: none;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>Student Management System</h2>

        <a href="/dashboard">
            Dashboard
        </a>

    </div>


    <div class="container">

        <div class="form-card">

            <h1>➕ Add New Student</h1>

            <p class="subtitle">
                Enter the student's information below.
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            {% if success %}

            <div class="success">
                {{ success }}
            </div>

            {% endif %}


            <form method="POST">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="id_number">
                            Student ID
                        </label>

                        <input
                            type="text"
                            id="id_number"
                            name="id_number"
                            placeholder="Enter Student ID"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter Student Name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter Age"
                            min="1"
                            max="100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required
                        >

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="phone_number">
                            Phone Number
                        </label>

                        <input
                            type="text"
                            id="phone_number"
                            name="phone_number"
                            placeholder="Enter Phone Number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="class">
                            Class
                        </label>

                        <input
                            type="text"
                            id="class"
                            name="class"
                            placeholder="Example: 10th"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter Email"
                            required
                        >

                    </div>


                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Student
                    </button>


                    <a
                        href="/dashboard"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
