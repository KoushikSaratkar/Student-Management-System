<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc3545;
            padding: 9px 18px;
            border-radius: 6px;
        }

        .container {
            padding: 30px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            color: #222;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .card h2 {
            color: #007bff;
            font-size: 30px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            background: white;
            padding: 25px;
            border-radius: 10px;
            color: #222;
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .menu a:hover {
            background: #007bff;
            color: white;
        }

        @media (max-width: 768px) {

            .cards,
            .menu {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>Student Management System</h2>

        <a href="/logout" class="logout">
            Logout
        </a>

    </div>


    <div class="container">

        <div class="welcome">

            <h1>
                Welcome, {{ student_name }}! 👋
            </h1>

            <p>
                Student ID: {{ student_id }}
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <h3>Student ID</h3>

                <h2>
                    {{ student_id }}
                </h2>

            </div>


            <div class="card">

                <h3>Account Status</h3>

                <h2>
                    Active
                </h2>

            </div>


            <div class="card">

                <h3>System</h3>

                <h2>
                    Student
                </h2>

            </div>

        </div>


        <div class="menu">

            <a href="/profile">
                👤 My Profile
            </a>

            <a href="/students">
                🎓 Student Details
            </a>

            <a href="/student-card">
                🪪 Student Card
            </a>

            <a href="/send-email">
                📧 Send Email
            </a>

            <a href="/search">
                🔍 Search Student
            </a>

            <a href="/add-student">
                ➕ Add Student
            </a>

            <a href="/settings">
                ⚙️ Settings
            </a>

        </div>

    </div>

</body>

</html>
