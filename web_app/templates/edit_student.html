<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #0056b3;
            padding: 9px 18px;
            border-radius: 6px;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        .readonly {
            background: #eee;
            cursor: not-allowed;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .update-btn {
            border: none;
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #0056b3;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            padding: 12px 25px;
            border-radius: 7px;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>Student Management System</h2>

        <a href="/students">
            Students
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h1>✏️ Edit Student</h1>

            <p class="subtitle">
                Update student information.
            </p>


            <form method="POST">

                <div class="grid">

                    <div class="group">

                        <label>
                            Student ID
                        </label>

                        <input
                            type="text"
                            value="{{ student['id_number'] }}"
                            class="readonly"
                            readonly
                        >

                    </div>


                    <div class="group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            value="{{ student['name'] }}"
                            required
                        >

                    </div>


                    <div class="group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            value="{{ student['age'] }}"
                            required
                        >

                    </div>


                    <div class="group">

                        <label for="gender">
                            Gender
                        </label>

                        <select
                            id="gender"
                            name="gender"
                            required
                        >

                            <option
                                value="Male"
                                {% if student['gender'] == 'Male' %}
                                selected
                                {% endif %}
                            >
                                Male
                            </option>

                            <option
                                value="Female"
                                {% if student['gender'] == 'Female' %}
                                selected
                                {% endif %}
                            >
                                Female
                            </option>

                            <option
                                value="Other"
                                {% if student['gender'] == 'Other' %}
                                selected
                                {% endif %}
                            >
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="group">

                        <label for="phone_number">
                            Phone
                        </label>

                        <input
                            type="text"
                            id="phone_number"
                            name="phone_number"
                            value="{{ student['phone_number'] }}"
                            required
                        >

                    </div>


                    <div class="group">

                        <label for="class">
                            Class
                        </label>

                        <input
                            type="text"
                            id="class"
                            name="class"
                            value="{{ student['class'] }}"
                            required
                        >

                    </div>


                    <div class="group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ student['email'] }}"
                            required
                        >

                    </div>

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="update-btn"
                    >
                        Update Student
                    </button>

                    <a
                        href="/students"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
