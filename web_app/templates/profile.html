<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .profile-card h1 {
            margin-bottom: 25px;
            color: #222;
        }

        .profile-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            color: #666;
            margin-bottom: 5px;
        }

        .info-box span {
            font-size: 17px;
            color: #222;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 600px) {

            .profile-info {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>Student Management System</h2>

        <a href="/dashboard">
            Dashboard
        </a>

    </div>


    <div class="container">

        <div class="profile-card">

            <h1>My Profile</h1>

            <div class="profile-info">

                <div class="info-box">
                    <strong>Name</strong>
                    <span>{{ student['name'] }}</span>
                </div>

                <div class="info-box">
                    <strong>Student ID</strong>
                    <span>{{ student['id_number'] }}</span>
                </div>

                <div class="info-box">
                    <strong>Age</strong>
                    <span>{{ student['age'] }}</span>
                </div>

                <div class="info-box">
                    <strong>Gender</strong>
                    <span>{{ student['gender'] }}</span>
                </div>

                <div class="info-box">
                    <strong>Phone</strong>
                    <span>{{ student['phone_number'] }}</span>
                </div>

                <div class="info-box">
                    <strong>Class</strong>
                    <span>{{ student['class'] }}</span>
                </div>

                <div class="info-box">
                    <strong>Email</strong>
                    <span>{{ student['email'] }}</span>
                </div>

            </div>

            <a href="/dashboard" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
