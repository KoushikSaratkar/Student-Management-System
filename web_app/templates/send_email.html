<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Send Email</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;

            background: #0056b3;

            padding: 9px 18px;

            border-radius: 6px;
        }

        .container {
            max-width: 750px;

            margin: 40px auto;

            padding: 20px;
        }

        .card {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        textarea {

            min-height: 160px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {

            outline: none;

            border-color: #007bff;
        }

        .send-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .send-btn:hover {

            background: #0056b3;
        }

        .error {

            background: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;
        }

        .success {

            background: #d1e7dd;

            color: #0f5132;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;
        }

    </style>

</head>

<body>


    <div class="navbar">

        <h2>
            Student Management System
        </h2>

        <a href="/dashboard">
            Dashboard
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h1>
                📧 Send Email
            </h1>

            <p class="subtitle">
                Send an email from the student management system.
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            {% if success %}

            <div class="success">
                {{ success }}
            </div>

            {% endif %}


            <form method="POST">


                <div class="form-group">

                    <label for="recipient">
                        Recipient Email
                    </label>

                    <input
                        type="email"
                        id="recipient"
                        name="recipient"
                        placeholder="Enter recipient email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter email subject"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="send-btn"
                >
                    📤 Send Email
                </button>


            </form>

        </div>

    </div>

</body>

</html>
