<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .navbar {
            height: 65px;
            background: #007bff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .info p {
            margin-bottom: 8px;
        }

        .info p:last-child {
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        .change-btn {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #007bff;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .change-btn:hover {
            background: #0056b3;
        }

        .error {
            background: #f8d7da;
            color: #842029;

            padding: 12px;
            border-radius: 7px;

            margin-bottom: 20px;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;

            padding: 12px;
            border-radius: 7px;

            margin-bottom: 20px;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            background: #6c757d;
            color: white;

            padding: 10px 18px;

            border-radius: 6px;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <h2>
            Student Management System
        </h2>

        <a href="/dashboard">
            Dashboard
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h1>
                ⚙️ Settings
            </h1>

            <p class="subtitle">
                Manage your student account.
            </p>


            <div class="info">

                <p>
                    <strong>Student ID:</strong>
                    {{ session["student_id"] }}
                </p>

                <p>
                    <strong>Name:</strong>
                    {{ session["student_name"] }}
                </p>

            </div>

        </div>


        <div class="card">

            <h2>
                🔐 Change Password
            </h2>

            <br>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            {% if success %}

            <div class="success">
                {{ success }}
            </div>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label>
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="change-btn"
                >
                    🔐 Change Password
                </button>

            </form>


            <a
                href="/dashboard"
                class="back"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
